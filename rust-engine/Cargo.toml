[package]
name = "twin_prime_engine"
version = "3.0.0"
edition = "2021"
authors = ["Twin Prime Engine Project"]
description = "High-performance twin prime search engine"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rayon = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
