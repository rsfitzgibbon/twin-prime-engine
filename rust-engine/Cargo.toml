[package]
name = "twin_prime_engine"
version = "5.2.0"
edition = "2021"
description = "High-performance twin prime search engine with GMP-accelerated arithmetic"

[dependencies]
rug = { version = "1", features = ["integer"] }
gmp-mpfr-sys = { version = "1.7.0", features = ["c-no-tests"] }
rayon = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
