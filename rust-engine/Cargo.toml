[package]
name = "twin_prime_engine"
version = "5.1.0"
edition = "2021"
authors = ["Twin Prime Engine Project"]
description = "High-performance twin prime search engine with GMP-accelerated arithmetic"

[dependencies]
rug = { version = "1", features = ["integer"] }
rayon = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
